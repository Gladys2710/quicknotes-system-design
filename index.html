<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <h1>QuickNotes</h1>
  <button id="load-btn">Load notes</button>
  <p id="status"></p>
  <form id="note-form">
    <label for="title-input">Title</label>
    <input id="title-input" type="text" maxlength="100">
    <label for="body-input">Body</label>
    <textarea id="body-input"></textarea>
    <button id="submit-btn" type="submit">Add note</button>
  </form>
  <ul id="notes-list"></ul>
</body>
</html>
